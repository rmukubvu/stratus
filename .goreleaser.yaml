version: 2

project_name: stratus

before:
  hooks:
    - go mod tidy

builds:
  - id: stratus
    main: ./cmd/stratus
    binary: stratus
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: stratus
    ids:
      - stratus
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}arm64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

# Multi-arch image at ghcr.io/rmukubvu/stratus, tagged with the version and
# latest. The release workflow logs in to GHCR and sets up buildx.
dockers_v2:
  - id: stratus
    ids:
      - stratus
    dockerfile: build/container/Dockerfile
    images:
      - ghcr.io/rmukubvu/stratus
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: stratus
      org.opencontainers.image.description: Fast local AWS emulator for tests, CI and coding agents
      org.opencontainers.image.source: https://github.com/rmukubvu/stratus
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: Apache-2.0

release:
  github:
    owner: rmukubvu
    name: stratus

brews:
  - name: stratus
    ids:
      - stratus
    repository:
      owner: rmukubvu
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/rmukubvu/stratus
    description: Fast local AWS emulator for real AWS CLI, SDK, CDK, and Preflight workflows
    license: Apache-2.0
    test: |
      system "#{bin}/stratus", "--help"
    install: |
      bin.install "stratus"

