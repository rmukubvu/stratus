name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pre-pull Lambda runtime image
        run: docker pull public.ecr.aws/lambda/python:3.11

      - name: Pre-pull Node Lambda runtime image
        run: docker pull public.ecr.aws/lambda/nodejs:20

      - name: Pre-pull Java and custom-runtime Lambda images
        run: |
          docker pull public.ecr.aws/lambda/java:21
          docker pull public.ecr.aws/lambda/provided:al2023
          docker pull python:3.11-slim

      - name: Pre-pull RDS and ElastiCache engine images
        run: |
          docker pull postgres:16-alpine
          docker pull valkey/valkey:8

      - name: Pre-pull the MSK broker image
        run: docker pull redpandadata/redpanda:v24.2.7

      - name: Run test suite
        run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Contract tests need the AWS CLI and Linux Docker images, so Windows
      # runs the unit and in-process integration tests.
      - name: Run unit tests
        run: go test ./internal/... ./cmd/...

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Unit-test the action
        shell: bash
        run: node --test action/*.test.js

      - name: Run a command against a throwaway Stratus
        uses: ./
        with:
          version: source
          run: |
            curl -fsS -X PUT "$AWS_ENDPOINT_URL/action-demo" -o /dev/null
            echo hello | curl -fsS -X PUT --data-binary @- "$AWS_ENDPOINT_URL/action-demo/hello.txt" -o /dev/null
            test "$(curl -fsS "$AWS_ENDPOINT_URL/action-demo/hello.txt")" = "hello"

      - name: Start a background Stratus on a fixed port
        id: fixed
        uses: ./
        with:
          version: source
          port: "4577"

      - name: Start a second background Stratus on a free port
        id: stratus
        uses: ./
        with:
          version: source

      - name: Use the background Stratus from a later step
        shell: bash
        run: |
          test "${{ steps.fixed.outputs.endpoint }}" = "http://127.0.0.1:4577"
          test "$AWS_ENDPOINT_URL" = "${{ steps.stratus.outputs.endpoint }}"
          test "$AWS_ENDPOINT_URL" != "${{ steps.fixed.outputs.endpoint }}"
          curl -fsS "${{ steps.fixed.outputs.endpoint }}/_stratus/control/v1/ready"
          curl -fsS "$STRATUS_ENDPOINT/_stratus/control/v1/ready"
          stratus snapshot save from-action

  # Builds the release image the way GoReleaser does (a context holding
  # linux/<arch>/stratus) and checks it serves and reports healthy.
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the image
        run: |
          ctx="$RUNNER_TEMP/image"
          mkdir -p "$ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$ctx/linux/amd64/stratus" ./cmd/stratus
          docker buildx build --platform linux/amd64 --load -t stratus:ci -f build/container/Dockerfile "$ctx"

      - name: Run it and wait until healthy
        run: |
          docker run -d --name stratus -p 4566:4566 stratus:ci
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' stratus)"
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker inspect -f '{{.State.Health.Status}}' stratus | grep -qx healthy || { docker logs stratus; exit 1; }
          curl -fsS -X PUT http://127.0.0.1:4566/image-check -o /dev/null
          curl -fsS http://127.0.0.1:4566/_stratus/health

      # A runner container that shares the host's docker.sock: Stratus must
      # find its own container, put engines and Lambdas on its network and
      # reach them there, with nothing published on the host.
      - name: Run Lambda, RDS and MSK through the host's Docker socket
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:4567
        run: |
          docker pull -q postgres:16-alpine
          docker pull -q public.ecr.aws/lambda/python:3.11
          docker pull -q redpandadata/redpanda:v24.2.7
          docker network create ci-shared
          docker run -d --name stratus-shared --network ci-shared -p 4567:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock stratus:ci \
            serve --port 4566 --data-dir /var/lib/stratus --log-level info
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:4567/_stratus/health >/dev/null && break; sleep 1; done
          docker logs stratus-shared 2>&1 | grep -q '"reach":"network:ci-shared"' || { docker logs stratus-shared; exit 1; }

          printf 'def handler(event, context):\n    return {"ok": True}\n' > app.py && zip -q fn.zip app.py
          aws lambda create-function --function-name shared --runtime python3.11 \
            --role arn:aws:iam::000000000000:role/x --handler app.handler --zip-file fileb://fn.zip >/dev/null
          aws lambda invoke --function-name shared out.json >/dev/null
          grep -q '"ok": true' out.json || { cat out.json; docker logs stratus-shared; exit 1; }

          aws rds create-db-instance --db-instance-identifier orders --engine postgres \
            --db-instance-class db.t3.micro --master-username app --master-user-password secret123 \
            --allocated-storage 20 >/dev/null
          address="$(aws rds describe-db-instances --db-instance-identifier orders \
            --query 'DBInstances[0].Endpoint.Address' --output text)"
          docker run --rm --network ci-shared -e PGPASSWORD=secret123 postgres:16-alpine \
            psql -h "$address" -U app -d postgres -tc "select 1" | grep -q 1

          # The broker must advertise the name it has on the shared network,
          # or clients that follow its metadata cannot produce or consume.
          arn="$(aws kafka create-cluster-v2 --cluster-name events --provisioned \
            '{"BrokerNodeGroupInfo":{"InstanceType":"kafka.m5.large","ClientSubnets":["subnet-1","subnet-2"]},"KafkaVersion":"3.6.0","NumberOfBrokerNodes":2}' \
            --query ClusterArn --output text)"
          brokers="$(aws kafka get-bootstrap-brokers --cluster-arn "$arn" --query BootstrapBrokerString --output text)"
          rpk() { docker run --rm -i --network ci-shared --entrypoint rpk redpandadata/redpanda:v24.2.7 "$@" -X brokers="$brokers"; }
          rpk topic create orders
          echo '{"order":1}' | rpk topic produce orders
          rpk topic consume orders -n 1 | grep -q '"order\\":1' || { docker logs stratus-shared; exit 1; }

          if docker ps --format '{{.Names}} {{.Ports}}' | grep -v '^stratus-shared ' | grep '^stratus-.*->'; then
            echo "engine or Lambda ports were published on the host"; exit 1
          fi
          docker stop -t 30 stratus-shared
          if docker ps -aq --filter label=io.stratus.managed=true | grep -q .; then
            echo "containers left behind"; exit 1
          fi

  # Stratus in a Kubernetes runner pod that mounts the node's docker.sock,
  # with STRATUS_DOCKER_HOST_ADDRESS from the downward API. minikube's node
  # runs Docker, as such nodes do.
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the image
        run: |
          ctx="$RUNNER_TEMP/image"
          mkdir -p "$ctx/linux/amd64"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o "$ctx/linux/amd64/stratus" ./cmd/stratus
          docker buildx build --platform linux/amd64 --load -t stratus:ci -f build/container/Dockerfile "$ctx"

      - name: Start minikube with Docker on the node
        run: |
          if ! command -v minikube >/dev/null; then
            curl -fsSLo minikube https://github.com/kubernetes/minikube/releases/download/v1.36.0/minikube-linux-amd64
            sudo install minikube /usr/local/bin/minikube
          fi
          minikube start --driver=docker --container-runtime=docker --memory=6g --cpus=2 --wait=all
          kubectl get nodes -o wide

      - name: Put images in the node's Docker
        run: |
          minikube image load stratus:ci
          for image in postgres:16-alpine redpandadata/redpanda:v24.2.7 public.ecr.aws/lambda/python:3.11; do
            minikube ssh -- docker pull -q "$image"
          done

      - name: Run Lambda, RDS and MSK from a runner pod
        run: test/kubernetes/run.sh

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20"
            python: "3.11"
          - node: "22"
            python: "3.13"
    runs-on: ubuntu-latest
    name: sdk (node ${{ matrix.node }}, python ${{ matrix.python }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The SDK integration tests read STRATUS_ENDPOINT, which this sets.
      - name: Start a background Stratus
        uses: ./
        with:
          version: source

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests

  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build stratus
        run: go build -o "$RUNNER_TEMP/stratus" ./cmd/stratus

      # Fails if any claim in examples/agent-demo/README.md stops being true.
      - name: Agent demo replay
        env:
          STRATUS_BIN: ${{ runner.temp }}/stratus
        run: |
          python -m pip install boto3
          python examples/agent-demo/replay.py

      - name: Isolation benchmark
        run: |
          echo "## Test isolation benchmark" >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/stratus-bench -tests 10 -json bench.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Boot benchmark
        env:
          STRATUS_BIN: ${{ runner.temp }}/stratus
        run: |
          docker pull -q postgres:16-alpine
          echo "## Cold boot benchmark" >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/stratus-bench boot -binary "$STRATUS_BIN" -runs 10 -engine -json boot.json | tee -a "$GITHUB_STEP_SUMMARY"

  release-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Stratus
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check AWS CLI
        run: aws --version

      - name: Pre-pull Lambda runtime image
        run: docker pull public.ecr.aws/lambda/python:3.11

      - name: Pre-pull Node Lambda runtime image
        run: docker pull public.ecr.aws/lambda/nodejs:20

      - name: Clone Preflight
        run: git clone --depth 1 https://github.com/rmukubvu/preflight.git "$RUNNER_TEMP/preflight"

      - name: Run release gate
        env:
          PREFLIGHT_DIR: ${{ runner.temp }}/preflight
        run: bash ./scripts/release-gate.sh
