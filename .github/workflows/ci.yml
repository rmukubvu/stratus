name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Pre-pull Lambda runtime image
        run: docker pull public.ecr.aws/lambda/python:3.11

      - name: Pre-pull Node Lambda runtime image
        run: docker pull public.ecr.aws/lambda/nodejs:20

      - name: Pre-pull Java and custom-runtime Lambda images
        run: |
          docker pull public.ecr.aws/lambda/java:21
          docker pull public.ecr.aws/lambda/provided:al2023
          docker pull python:3.11-slim

      - name: Pre-pull RDS and ElastiCache engine images
        run: |
          docker pull postgres:16-alpine
          docker pull valkey/valkey:8

      - name: Pre-pull the MSK broker image
        run: docker pull redpandadata/redpanda:v24.2.7

      - name: Run test suite
        run: go test ./...

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      # Contract tests need the AWS CLI and Linux Docker images, so Windows
      # runs the unit and in-process integration tests.
      - name: Run unit tests
        run: go test ./internal/... ./cmd/...

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run a command against a throwaway Stratus
        uses: ./
        with:
          version: source
          run: |
            curl -fsS -X PUT "$AWS_ENDPOINT_URL/action-demo" -o /dev/null
            echo hello | curl -fsS -X PUT --data-binary @- "$AWS_ENDPOINT_URL/action-demo/hello.txt" -o /dev/null
            test "$(curl -fsS "$AWS_ENDPOINT_URL/action-demo/hello.txt")" = "hello"

      - name: Start a background Stratus
        id: stratus
        uses: ./
        with:
          version: source
          port: "4577"

      - name: Use the background Stratus from a later step
        shell: bash
        run: |
          test "$AWS_ENDPOINT_URL" = "${{ steps.stratus.outputs.endpoint }}"
          curl -fsS "$STRATUS_ENDPOINT/_stratus/control/v1/ready"
          stratus snapshot save from-action

  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "20"
            python: "3.11"
          - node: "22"
            python: "3.13"
    runs-on: ubuntu-latest
    name: sdk (node ${{ matrix.node }}, python ${{ matrix.python }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The SDK integration tests read STRATUS_ENDPOINT, which this sets.
      - name: Start a background Stratus
        uses: ./
        with:
          version: source

      - name: TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test

      - name: Python SDK
        working-directory: sdk/python
        run: |
          python -m pip install -e . pytest
          python -m pytest -q tests

  proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build stratus
        run: go build -o "$RUNNER_TEMP/stratus" ./cmd/stratus

      # Fails if any claim in examples/agent-demo/README.md stops being true.
      - name: Agent demo replay
        env:
          STRATUS_BIN: ${{ runner.temp }}/stratus
        run: |
          python -m pip install boto3
          python examples/agent-demo/replay.py

      - name: Isolation benchmark
        run: |
          echo "## Test isolation benchmark" >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/stratus-bench -tests 10 -json bench.json | tee -a "$GITHUB_STEP_SUMMARY"

  release-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Stratus
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check AWS CLI
        run: aws --version

      - name: Pre-pull Lambda runtime image
        run: docker pull public.ecr.aws/lambda/python:3.11

      - name: Pre-pull Node Lambda runtime image
        run: docker pull public.ecr.aws/lambda/nodejs:20

      - name: Clone Preflight
        run: git clone --depth 1 https://github.com/rmukubvu/preflight.git "$RUNNER_TEMP/preflight"

      - name: Run release gate
        env:
          PREFLIGHT_DIR: ${{ runner.temp }}/preflight
        run: bash ./scripts/release-gate.sh
